  // ─── HURRICANE EVENT ACTIONS ─────────────────────────────────
  // Player pi picks card index ci to discard
  function hurricaneDiscard(pi,ci){
    if(phase!=="hurricane")return;
    if(hurricaneTurn!==pi)return; // wrong turn
    if(hurricaneDiscards[pi]!==undefined)return; // already chose
    if(hurricaneAnimatingDiscard)return; // already animating
    if(soundOn)SFX.deal();
    // Step 1: trigger spiral-out animation by marking this card
    setHurricaneAnimatingDiscard({pi:pi,ci:ci});
    // Step 2: after animation completes (~700ms), commit the discard
    setTimeout(function(){
      var newDiscards=Object.assign({},hurricaneDiscards);newDiscards[pi]=ci;
      setHurricaneDiscards(newDiscards);
      var discardedCard=hands[pi]&&hands[pi][ci];
      if(discardedCard){
        setHurricaneDiscardedCards(function(prev){var n=Object.assign({},prev);n[pi]=discardedCard;return n;});
      }
      setHurricaneAnimatingDiscard(null);
      // Advance turn
      var nextTurn=(pi+1)%pc;
      var firstChooser=(dealer+1)%pc;
      if(nextTurn===firstChooser){
        setHurricaneTurn(null);
        setTimeout(function(){hurricaneRefill(newDiscards);},500);
      }else{
        setHurricaneTurn(nextTurn);
      }
    },700);
  }

  // Draw refill cards from remaining deck and replace discarded ones
  function hurricaneRefill(discards){
    // Build set of "used" cards (all hands flat, except discarded)
    var usedKey={};
    hands.forEach(function(h,pi){
      h.forEach(function(c,ci){
        if(discards[pi]===ci)return; // discarded → don't include
        usedKey[c.rank+c.suit]=true;
      });
    });
    // Generate fresh deck and find first unused card per player needing refill
    var fullDeck=createDeck();
    var refills={};
    var newHands=hands.map(function(h){return h.slice();});
    for(var pi=0;pi<pc;pi++){
      if(discards[pi]===undefined)continue;
      // Find a card not in usedKey
      for(var di=0;di<fullDeck.length;di++){
        var c=fullDeck[di];
        var k=c.rank+c.suit;
        if(!usedKey[k]){
          refills[pi]=c;
          usedKey[k]=true; // reserve
          newHands[pi][discards[pi]]=c; // replace
          break;
        }
      }
    }
    setHurricaneRefills(refills);
    setHands(newHands);
    // Mark all refilled slots as animating spawn
    var spawnSet=new Set();
    for(var pi3=0;pi3<pc;pi3++){if(discards[pi3]!==undefined)spawnSet.add(pi3);}
    setHurricaneAnimatingRefill(spawnSet);
    // Clear after animation duration
    setTimeout(function(){setHurricaneAnimatingRefill(new Set());},900);
    // Clear the discarded card's revealed state so the player can re-squeeze
    setRevealedCards(function(prev){
      var ns=prev.map(function(s){return new Set(s);});
      for(var pi2=0;pi2<pc;pi2++){
        if(discards[pi2]!==undefined)ns[pi2].delete(discards[pi2]);
      }
      return ns;
    });
    // Re-compute alerts based on new hands
    var newAlerts=computeAlerts(newHands);
    // Compute the deck pool: all 52 cards minus current hands.
    // Discards return to the pool (per hurricaneRefill logic), so they're NOT excluded.
    var poolUsed={};
    newHands.forEach(function(h){if(h)h.forEach(function(c){if(c)poolUsed[c.rank+c.suit]=true;});});
    var deckPool=[];
    for(var psi=0;psi<SUITS.length;psi++){
      for(var pri=0;pri<RANKS.length;pri++){
        var pk=RANKS[pri]+SUITS[psi];
        if(!poolUsed[pk])deckPool.push({rank:RANKS[pri],suit:SUITS[psi],flipped:false});
      }
    }
    // Suppress fake alerts (red/glitch) when no remaining deck card can complete niuniu+
    // ALSO suppress undei whiteblack hazure if the 4 NON-refill cards can't reach niuniu (the refill card itself is the unknown)
    for(var spi=0;spi<pc;spi++){
      if(discards[spi]===undefined)continue;
      var sa=newAlerts[spi];
      if(!sa)continue;
      // Build the 4 cards that are visible BEFORE the refill is squeezed
      var fourKnown=[];
      for(var fki=0;fki<5;fki++){if(fki!==discards[spi])fourKnown.push(newHands[spi][fki]);}
      if(sa.type==="red"||sa.type==="glitch"){
        // existing: red/glitch suppression with deck pool check
        var poolWithRefill=deckPool.slice();
        var refillCard=newHands[spi]&&newHands[spi][discards[spi]];
        if(refillCard)poolWithRefill.push(refillCard);
        if(!canHurricaneStillBeNiuNiu(fourKnown,poolWithRefill)){
          delete newAlerts[spi];
        }
      }else if(sa.type==="whiteblack"){
        // Undei whiteblack: ensure the 4 visible cards (excluding refill) can still complete niuniu+.
        // Otherwise the player sees "no niuniu possible" before squeezing the refill → broken drama.
        if(!canStillBeNiuNiu(fourKnown)){
          delete newAlerts[spi];
        }
      }
    }
    setAlerts(newAlerts);
    // Play alert SFX immediately when refill card appears (synced with spawn animation)
    if(soundOn){
      for(var pi4=0;pi4<pc;pi4++){
        if(discards[pi4]===undefined)continue;
        var alert4=newAlerts[pi4];
        if(!alert4)continue;
        (function(at,offset){setTimeout(function(){playAlertSFX(at);},300+offset);})(alert4.type,pi4*60);
      }
    }
  }

  // Player re-reveals the refilled card (re-squeeze experience)
  function hurricaneRevealRefill(pi){
    var ci=hurricaneDiscards[pi];
    if(ci===undefined)return;
    if(hurricaneRefilledRevealed.has(pi))return;
    if(soundOn)SFX.deal();
    var ns=new Set(hurricaneRefilledRevealed);ns.add(pi);
    setHurricaneRefilledRevealed(ns);
    // Reveal the card in revealedCards too
    setRevealedCards(function(prev){
      var ns2=prev.map(function(s){return new Set(s);});
      ns2[pi].add(ci);
      // Standard size=5 sound (same as normal revealCard)
      if(ns2[pi].size===5&&soundOn){
        var ev2=evaluateHand(hands[pi]);
        setTimeout(function(){if(ev2.hasBull)SFX.bullFound();else SFX.noBull();},200);
      }
      // If all players have revealed their refills, transition to result calculation
      if(ns.size===pc){
        setTimeout(function(){
          var ev=hands.map(function(h){return evaluateHand(h);});
          setResults(ev);
          // Reuse battle result logic
          var dealerEv=ev[dealer];
          var deltas={};for(var ii=0;ii<pc;ii++)deltas[ii]=0;
          for(var ci2=0;ci2<pc;ci2++){
            if(ci2===dealer)continue;
            var childEv=ev[ci2];
            var dealerWins=dealerEv.bullRank>childEv.bullRank||(dealerEv.bullRank===childEv.bullRank&&dealerEv.highCard>childEv.highCard);
            var bet=bets[ci2]||1;
            var mult;
            if(betRule==="offset"){mult=calcMultiplierOffset(dealerEv.bullValue,childEv.bullValue);}
            else{mult=dealerWins?calcMultiplierNoOffset(dealerEv.bullValue):calcMultiplierNoOffset(childEv.bullValue);}
            var amount=Math.round(bet*mult);
            if(dealerWins){deltas[dealer]+=amount;deltas[ci2]-=amount;}
            else{deltas[dealer]-=amount;deltas[ci2]+=amount;}
          }
          setRoundDeltas(deltas);
          setChips(function(prev){var n=Object.assign({},prev);for(var k in deltas)n[k]=(n[k]||0)+deltas[k];return n;});
          var bestDelta=-Infinity,bestIdx=0;
          for(var k2 in deltas){if(deltas[k2]>bestDelta){bestDelta=deltas[k2];bestIdx=parseInt(k2);}}
          setWinner(bestIdx);
          setHistory(function(prev){return prev.concat([{round:roundNum+1,dealer:dealer,results:ev,deltas:deltas,bets:Object.assign({},bets),names:names.slice(),event:"hurricane"}]);});
          setPhase("result");
          if(soundOn){SFX.win();setTimeout(launchConfetti,100);}
        },400);
      }
      return ns2;
    });
  }

  // Event mode: open all 5 cards for ALL players at once (single button)
  // ─── ROULETTE EVENT ACTIONS ─────────────────────────────────
  // Spin the roulette, animate, land on a delta, then apply to all hands
  function startRouletteSpin(){
    if(getCurrentEvent()!=="roulette")return;
    if(rouletteSpinning||rouletteDelta!==null)return;
    setRouletteSpinning(true);
    if(soundOn)SFX.alertGrowBull(); // reuse for spin start
    var landedDelta=rollRouletteDelta();
    var nNumbers=10; // -4 to +5 (-5 removed: mathematically equivalent to +5 under modulo 10)
    var deltaAngle=landedDelta*(360/nNumbers);
    var finalRotation=-deltaAngle+1440; // 4 full spins + landing
    
    // === 反転判定 (FIRST) ===
    // delta ≠ 0 のとき 25%で発動。反転が起こる場合は blackout を一切発動させない。
    var signFlipWillTrigger=(landedDelta!==0&&Math.random()<0.25);
    
    // === BLACKOUT 判定 ===
    // 親(dealer)の最終 bullRank が 牛牛(10) or 牛1(1) になる場合、50%で blackout 発動
    // ただし反転が発動する場合は、両イベント同時発生を防ぐため blackout はキャンセル
    var dealerBlackout=false;
    if(!signFlipWillTrigger&&hands[dealer]){
      var dealerEvOrig=evaluateHand(hands[dealer]);
      if(dealerEvOrig.bullRank>=1&&dealerEvOrig.bullRank<=10){
        var dealerLandedRank=applyRouletteDelta(dealerEvOrig.bullRank, landedDelta);
        if((dealerLandedRank===10||dealerLandedRank===1)&&Math.random()<0.5){
          dealerBlackout=true;
        }
      }
    }
    
    // === ドキドキ演出パターンランダム選択 ===
    // 7パターン: A短め, B中, C長, D短フェイク手前, E長フェイク手前, F短通り過ぎ, G長通り過ぎ
    // - normal: 普通に減速して着地
    // - fake: 手前で一旦止まりかけ → さらに進んで着地 (進行方向に伸びる)
    // - overshoot: 行き過ぎて止まりかけ → 戻って着地 (逆方向に戻る、振り子型)
    var patterns=[
      {w:22,type:"normal",dur:9000,curve:"cubic-bezier(0.12, 0.7, 0.2, 1.0)",blackoutMs:8000},
      {w:22,type:"normal",dur:13000,curve:"cubic-bezier(0.15, 0.75, 0.18, 1.0)",blackoutMs:8000},
      {w:18,type:"normal",dur:18000,curve:"cubic-bezier(0.1, 0.8, 0.12, 1.0)",blackoutMs:8000},
      {w:11,type:"fake",dur1:9600,curve1:"cubic-bezier(0.1, 0.85, 0.15, 1.0)",pauseMs:1000,dur2:3400,curve2:"cubic-bezier(0.3, 0.7, 0.4, 1.0)",fakeOffset:2,blackoutMs:8000},
      {w:11,type:"fake",dur1:15600,curve1:"cubic-bezier(0.08, 0.85, 0.1, 1.0)",pauseMs:1200,dur2:4200,curve2:"cubic-bezier(0.25, 0.7, 0.4, 1.0)",fakeOffset:1,blackoutMs:8000},
      {w:8,type:"overshoot",dur1:9800,curve1:"cubic-bezier(0.1, 0.85, 0.18, 1.0)",pauseMs:900,dur2:1800,curve2:"cubic-bezier(0.4, 0.0, 0.3, 1.0)",overshootOffset:2,blackoutMs:8000},
      {w:8,type:"overshoot",dur1:16000,curve1:"cubic-bezier(0.08, 0.85, 0.12, 1.0)",pauseMs:1100,dur2:2400,curve2:"cubic-bezier(0.4, 0.0, 0.3, 1.0)",overshootOffset:2,blackoutMs:8000}
    ];
    var totalW=0;patterns.forEach(function(p){totalW+=p.w;});
    var roll=Math.random()*totalW;
    var chosen=patterns[0];
    var acc=0;
    for(var pi=0;pi<patterns.length;pi++){
      acc+=patterns[pi].w;
      if(roll<acc){chosen=patterns[pi];break;}
    }
    // ±10% の時間揺らぎ
    var jitter=function(v){return Math.round(v*(0.9+Math.random()*0.2));};
    
    // === 反転フェーズ ===
    // 着地後 500ms 結果を見せた後、事前決定された signFlipWillTrigger に従って反転フェーズに入る。
    // 反転発動時: rouletteDelta を null に戻し、円盤を -landedDelta 位置へアニメ → 着地 → applyRouletteToHands
    function maybeRunSignFlipThenFinish(){
      if(!signFlipWillTrigger){
        applyRouletteToHands(landedDelta);
        return;
      }
      var flippedDelta=-landedDelta;
      var flippedAngle=flippedDelta*(360/nNumbers);
      var flippedRotation=-flippedAngle+1440+360; // 1周追加して逆方向感
      var flipDurationMs=4500;
      // 1. 結果表示を一旦クリア (rouletteDelta = null) → ルーレット回転中表示に戻る
      setRouletteDelta(null);
      setRouletteSpinning(true);
      // 2. フラッシュ + テキスト発動
      setRouletteSignFlip(true);
      if(soundOn)SFX.alertGrowBull();
      // 3. 円盤を反転位置へアニメ
      setRouletteSpinAnim({rotation:flippedRotation,duration:flipDurationMs,curve:"cubic-bezier(0.3, 0.0, 0.3, 1.0)"});
      // 4. フラッシュ/テキスト解除
      setTimeout(function(){setRouletteSignFlip(false);},flipDurationMs);
      // 5. 反転アニメ完了後: 着地公開 → 余韻 → applyRouletteToHands
      setTimeout(function(){
        setRouletteDelta(flippedDelta);
        setRouletteSpinning(false);
        if(soundOn)SFX.bullFound();
        setTimeout(function(){applyRouletteToHands(flippedDelta);},500);
      },flipDurationMs);
    }
    
    // 着地完了時の処理: 結果公開 → 500ms 結果見せ → 反転判定
    function landRoulette(){
      if(dealerBlackout&&rouletteBlackout){
        setRouletteBlackout(false);
      }
      setRouletteDelta(landedDelta);
      setRouletteSpinning(false);
      if(soundOn)SFX.bullFound();
      // 「結果ちょっと見せる」間 (500ms) を置いてから反転判定
      setTimeout(maybeRunSignFlipThenFinish,500);
    }
    
    // 「最後の8秒間を blackout で覆う」 - スピン完了タイミングから巻き戻して発動
    function scheduleBlackoutBeforeEnd(totalRemainingMs,blackoutMs){
      if(!dealerBlackout)return;
      var triggerAt=Math.max(200,totalRemainingMs-blackoutMs);
      setTimeout(function(){
        setRouletteBlackout(true);
        if(soundOn)SFX.alertGrowBull();
      },triggerAt);
    }
    
    if(chosen.type==="normal"){
      var dur=jitter(chosen.dur);
      setRouletteSpinAnim({rotation:finalRotation,duration:dur,curve:chosen.curve});
      scheduleBlackoutBeforeEnd(dur,chosen.blackoutMs);
      setTimeout(landRoulette,dur);
    }else if(chosen.type==="fake"){
      // フェイクストップ: まず手前で止まりかけ → 短く休止 → 最終マスへ
      var fakeOffsetAngle=chosen.fakeOffset*(360/nNumbers);
      var fakeRotation=finalRotation-fakeOffsetAngle*(landedDelta>=0?1:-1);
      var d1=jitter(chosen.dur1),d2=jitter(chosen.dur2);
      setRouletteSpinAnim({rotation:fakeRotation,duration:d1,curve:chosen.curve1});
      var totalLen=d1+chosen.pauseMs+d2;
      scheduleBlackoutBeforeEnd(totalLen,chosen.blackoutMs);
      setTimeout(function(){
        setTimeout(function(){
          if(soundOn)SFX.buttonClick();
          setRouletteSpinAnim({rotation:finalRotation,duration:d2,curve:chosen.curve2});
          setTimeout(landRoulette,d2);
        },chosen.pauseMs);
      },d1);
    }else if(chosen.type==="overshoot"){
      // 通り過ぎ型: 最終位置を 2マス通り越して止まりかけ → 戻って着地 (振り子型)
      var overshootAngle=chosen.overshootOffset*(360/nNumbers);
      var overshootRotation=finalRotation+overshootAngle*(landedDelta>=0?1:-1);
      var od1=jitter(chosen.dur1),od2=jitter(chosen.dur2);
      setRouletteSpinAnim({rotation:overshootRotation,duration:od1,curve:chosen.curve1});
      var totalLenOs=od1+chosen.pauseMs+od2;
      scheduleBlackoutBeforeEnd(totalLenOs,chosen.blackoutMs);
      setTimeout(function(){
        setTimeout(function(){
          if(soundOn)SFX.buttonClick();
          setRouletteSpinAnim({rotation:finalRotation,duration:od2,curve:chosen.curve2});
          setTimeout(landRoulette,od2);
        },chosen.pauseMs);
      },od1);
    }
  }

  // ─── JACKPOT EVENT ─────────────────────────────────
  // Compute payouts with jackpot rules, then transition to result.
  // Rules:
  //  - Each dealer-vs-child match computes a base payout (same multiplier logic as battle).
  //  - If the LOSER of a match has bullRank 0 (役なし) AND the winner has bullRank 1-9:
  //      winner keeps HALF, the other HALF goes to the JP pool.
  //  - If the winner has bullRank>=10 (牛牛/special): winner takes FULL payout (no half-cut),
  //      no pool contribution from that match, and the winner JACKPOT-wins the whole pool.
  //  - Multiple child 牛牛(>=10) winners split the existing pool evenly.
  //  - Dealer with >=10 also qualifies for jackpot win.
  // ===== TULIP: flip resolver. A hand card also covers its neighbor ranks (A↔2, K↔Q, no wrap).
  //   match(F) = # of hand cards whose rank is within 1 of F (RANKS index distance <=1).
  //   kakuhen: a single flip hits 3+ → draw 2 at a time, +1/hit. 五小牛+ (bullRank>=14) starts in kakuhen.
  //   16R: a single flip hits 4+ → still +1/hit during the run, but the whole Tulip bonus (hits + completion) is ×2 at the END. Upgrades even from kakuhen. (The hand-points multiplier is paid by the normal dealer-vs-child payout, not by Tulip.)
  //   complete: clear the deck with a final hit → +5. bull10+ negates the first miss once.
  //   (Only the single STRONGEST hand flips, against the single WEAKEST hand — 1-on-1. See finalizeTulipRound.)
  function resolveTulip(handRanks, deckSeq, isBull10plus, startKak){
    var idx=function(r){return RANKS.indexOf(r);};
    var handV=handRanks.map(idx);
    var match=function(r){var f=idx(r);var c=0;for(var k=0;k<handV.length;k++){if(Math.abs(handV[k]-f)<=1)c++;}return c;};
    var bonus=0,i=0,mode=startKak?"kakuhen":"normal",guarantee=isBull10plus?1:0,completed=false,tier=startKak?"kakuhen":null,steps=[],N=deckSeq.length,batch=0;
    var rate=function(){return 1;}; // every hit is +1 (normal/kakuhen/16R alike); the 16R ×2 is applied once at the end in finalizeTulipRound
    function proc(){
      var r=deckSeq[i++];var m=match(r);var rt=rate();var st={r:r,m:m,mode:mode,rate:rt,batch:(mode==="normal"?0:batch)};
      if(m>=1)bonus+=rt*m;
      if(m>=4){if(mode!=="r16"){mode="r16";tier="r16";st.enterR16=true;}}
      else if(m>=3){if(mode==="normal"){mode="kakuhen";tier=tier||"kakuhen";st.enterKak=true;}}
      steps.push(st);return st;
    }
    while(true){
      if(i>=N){ if(steps.length>0){completed=true; steps[steps.length-1].comp=true;} break; }
      if(mode==="normal"){
        var st=proc();
        if(st.m>=1){ /* continue; mode may have escalated to kakuhen/16R */ }
        else{
          if(i>=N){st.stop=true; break;}
          else if(guarantee>0){guarantee--; st.guard=true;}
          else{st.stop=true; break;}
        }
      }else{ // kakuhen / 16R: draw 2 at a time
        batch++; var batchHits=0;
        for(var k=0;k<2 && i<N;k++){ var st2=proc(); if(st2.m>=1)batchHits++; }
        if(batchHits>=1){ if(i>=N){completed=true; steps[steps.length-1].comp=true; break;} }
        else{
          if(i>=N){steps[steps.length-1].stop=true; break;}
          else if(guarantee>0){guarantee--; steps[steps.length-1].guard=true;}
          else{steps[steps.length-1].stop=true; break;}
        }
      }
    }
    return {bonus:bonus, completed:completed, tier:tier, steps:steps};
  }

  function finalizeTulipRound(){
    var ev=hands.map(function(h){return evaluateHand(h);});
    setResults(ev);
    var dealerEv=ev[dealer];
    var deltas={};for(var ii=0;ii<pc;ii++)deltas[ii]=0;
    // (1) NORMAL dealer-vs-child payout — identical to a non-event round; happens every Tulip round.
    for(var ci=0;ci<pc;ci++){
      if(ci===dealer)continue;
      var childEv=ev[ci];
      var dWins=dealerEv.bullRank>childEv.bullRank||(dealerEv.bullRank===childEv.bullRank&&dealerEv.highCard>childEv.highCard);
      var nBet=bets[ci]||1;
      var nMult;
      if(betRule==="offset"){nMult=calcMultiplierOffset(dealerEv.bullValue,childEv.bullValue);}
      else{nMult=dWins?calcMultiplierNoOffset(dealerEv.bullValue):calcMultiplierNoOffset(childEv.bullValue);}
      var nAmt=Math.round(nBet*nMult);
      if(dWins){deltas[dealer]+=nAmt;deltas[ci]-=nAmt;}
      else{deltas[dealer]-=nAmt;deltas[ci]+=nAmt;}
    }
    var normalDeltas=Object.assign({},deltas); // snapshot of the normal payout BEFORE the Tulip duel (for staged reveal)
    // (2) INDEPENDENT Tulip duel — the single STRONGEST hand flips against the single WEAKEST hand; only its FLIP BONUS (hits, +completion, ×2 in 16R) moves chips between those two, ADDED on top of (1). The hand-points multiplier is NOT re-added here (it is already paid by (1)). Strength = bullRank, then highCard (unique).
    var remain=(remainingDeck&&remainingDeck.length)?remainingDeck.slice():[];
    function shuf(a){var d=a.slice();for(var x=d.length-1;x>0;x--){var y=Math.floor(Math.random()*(x+1));var t=d[x];d[x]=d[y];d[y]=t;}return d;}
    var sharedSeq=shuf(remain).map(function(c){return c.rank;});
    var maxIdx=0,minIdx=0;
    for(var p=1;p<pc;p++){
      if(ev[p].bullRank>ev[maxIdx].bullRank||(ev[p].bullRank===ev[maxIdx].bullRank&&ev[p].highCard>ev[maxIdx].highCard))maxIdx=p;
      if(ev[p].bullRank<ev[minIdx].bullRank||(ev[p].bullRank===ev[minIdx].bullRank&&ev[p].highCard<ev[minIdx].highCard))minIdx=p;
    }
    var handRanks=hands[maxIdx].map(function(c){return c.rank;});
    var isB10=ev[maxIdx].bullRank>=10;      // 転落保証 (skip first miss)
    var startKak=ev[maxIdx].bullRank>=14;   // 五小牛+ starts in kakuhen
    var r=resolveTulip(handRanks, sharedSeq, isB10, startKak);
    var comp=r.completed?5:0;               // completion bonus +5 (Tulip only)
    var isR16=r.tier==="r16";
    var addMult=isR16?(r.bonus+comp)*2:(r.bonus+comp); // Tulip bonus = flip hits (+completion), 16R doubles the whole thing; this IS the entire Tulip payout multiplier
    var duelBet=bets[minIdx]||1;            // the weakest (loser) stakes their bet
    var duelAmount=Math.round(duelBet*addMult); // FLIP BONUS ONLY — the hand-points (役の点数) multiplier is already paid by the normal dealer-vs-child payout above, so it is NOT re-added here
    deltas[maxIdx]+=duelAmount; deltas[minIdx]-=duelAmount;
    var tulipDeltas={};tulipDeltas[maxIdx]=duelAmount;tulipDeltas[minIdx]=-duelAmount; // the Tulip-only adjustment (shown as +/- in the staged reveal)
    var flip={idx:maxIdx,name:names[maxIdx],handRanks:handRanks,
              bonus:r.bonus,addMult:addMult,completed:r.completed,tier:r.tier,steps:r.steps,
              bull10:isB10,r16:isR16,vsIdx:minIdx,vsName:names[minIdx],label:ev[maxIdx].label};
    // Net biggest winner takes the crown (normal + duel combined).
    var bestDelta=-Infinity,bestIdx=0;
    for(var k2 in deltas){if(deltas[k2]>bestDelta){bestDelta=deltas[k2];bestIdx=parseInt(k2);}}
    tulipDeltasRef.current={deltas:deltas,normal:normalDeltas,tulip:tulipDeltas,winner:bestIdx}; // apply AFTER the reveal finishes
    setRoundDeltas(null); setWinner(null); // hide chip changes + winner crown on the board during the reveal
    setHistory(function(prev){return prev.concat([{round:roundNum+1,dealer:dealer,results:ev,deltas:deltas,bets:Object.assign({},bets),names:names.slice(),event:"tulip"}]);});
    pushHistory("niuniu_history_event",{date:new Date().toISOString(),rounds:roundNum+1,playerCount:pc,names:names,winner:bestIdx,results:ev,event:"tulip"});
    setAliceShared(sharedSeq);
    setAliceData([flip]);
    setAliceSi(0); setAliceBurst(false); setAliceDone(false); setX2Flash(false); setX2On(false); setCompOn(false); setAliceActive(true);
    setPhase("result"); // stay on the game board; the flip plays as an overlay
  }

  function finalizeJackpotRound(){
    var ev=hands.map(function(h){return evaluateHand(h);});
    setResults(ev);
    var dealerEv=ev[dealer];
    var deltas={};for(var ii=0;ii<pc;ii++)deltas[ii]=0;
    var grossDeltas={};for(var ig=0;ig<pc;ig++)grossDeltas[ig]=0; // deltas BEFORE jp cut (for animation)
    var poolAdd=0; // amount added to JP pool this round
    var jpContribs={}; // playerIdx -> amount they contributed to the pool this round

    function isFiveCard(e2){return e2&&e2.bullRank>=1;} // bullRank>=1 means has bull (1-10 or special>=14 also >=1)
    function isNoBull(e2){return !e2||e2.bullRank===0;}
    function isJackpotRank(e2){return e2&&e2.bullRank>=10;} // 牛牛(10) or special(>=14)

    for(var ci=0;ci<pc;ci++){
      if(ci===dealer)continue;
      var childEv=ev[ci];
      var dealerWins=dealerEv.bullRank>childEv.bullRank||(dealerEv.bullRank===childEv.bullRank&&dealerEv.highCard>childEv.highCard);
      var bet=bets[ci]||1;
      var mult;
      if(betRule==="offset"){mult=calcMultiplierOffset(dealerEv.bullValue,childEv.bullValue);}
      else{mult=dealerWins?calcMultiplierNoOffset(dealerEv.bullValue):calcMultiplierNoOffset(childEv.bullValue);}
      var amount=Math.round(bet*mult);
      var winnerEv=dealerWins?dealerEv:childEv;
      var loserEv=dealerWins?childEv:dealerEv;
      // Pool cut: loser is 役なし AND winner is NOT jackpot-rank (牛牛以上はカットされない).
      // A per-cool % (25-50, set by the slot) of the payout goes to the pool; remainder (incl. fraction) stays with the winner.
      var poolCut=0;
      var winnerGets=amount;
      if(isNoBull(loserEv)&&!isJackpotRank(winnerEv)){
        poolCut=Math.floor(amount*jpCutPct/100); // 整数優先(amount*pctを先に計算)でfloat丸め誤差を回避。端数は勝者へ(プール側切り捨て)。
        winnerGets=amount-poolCut;
        if(poolCut>0){
          // The winner of this match contributes poolCut to the pool
          var contribIdx=dealerWins?dealer:ci;
          jpContribs[contribIdx]=(jpContribs[contribIdx]||0)+poolCut;
        }
      }
      poolAdd+=poolCut;
      if(dealerWins){
        deltas[dealer]+=winnerGets;deltas[ci]-=amount;
        grossDeltas[dealer]+=amount;grossDeltas[ci]-=amount; // gross: winner gets full amount (pre-cut)
      }else{
        deltas[ci]+=winnerGets;deltas[dealer]-=amount;
        grossDeltas[ci]+=amount;grossDeltas[dealer]-=amount;
      }
      // Note: loser always pays full `amount`; the pool's cut comes out of the winner's take,
      // i.e. winner keeps (amount - cut), loser loses full amount, cut goes to pool.
    }

    // Determine jackpot winner. Candidates = players with bullRank>=10 (牛牛/special).
    // Among candidates, the SINGLE STRONGEST hand takes the entire pool (no split).
    // Strength ordering = same as match judgement: bullRank first, then highCard
    // (highCard includes suit via RANK_ORDER*10+SUIT_ORDER, so ties are impossible).
    var currentPool=jackpotPool+poolAdd;
    var jpCandidates=[];
    for(var pj=0;pj<pc;pj++){
      if(ev[pj]&&ev[pj].bullRank>=10)jpCandidates.push(pj);
    }
    var newPool=currentPool;
    var jackpotWinInfo=null;
    if(jpCandidates.length>0&&currentPool>0){
      // Pick the strongest candidate
      var bestJp=jpCandidates[0];
      for(var jc=1;jc<jpCandidates.length;jc++){
        var cand=jpCandidates[jc];
        if(ev[cand].bullRank>ev[bestJp].bullRank||
           (ev[cand].bullRank===ev[bestJp].bullRank&&ev[cand].highCard>ev[bestJp].highCard)){
          bestJp=cand;
        }
      }
      deltas[bestJp]+=currentPool;
      newPool=0; // reset after win
      jackpotWinInfo={winners:[bestJp],amount:currentPool,perWinner:currentPool};
      setJpCoolBet(0); setJpReelSpinning(false); // JP claimed → next cool's bet is pending (slot spin)
    }

    setRoundDeltas(deltas);
    setChips(function(prev){var n=Object.assign({},prev);for(var k in deltas)n[k]=(n[k]||0)+deltas[k];return n;});
    setJackpotPool(newPool);

    var bestDelta=-Infinity,bestIdx=0;
    for(var k2 in deltas){if(deltas[k2]>bestDelta){bestDelta=deltas[k2];bestIdx=parseInt(k2);}}
    setWinner(bestIdx);

    setHistory(function(prev){return prev.concat([{round:roundNum+1,dealer:dealer,results:ev,deltas:deltas,bets:Object.assign({},bets),names:names.slice(),event:"jackpot",jackpotAdd:poolAdd,jackpotWin:jackpotWinInfo}]);});
    pushHistory("niuniu_history_event",{
      date:new Date().toISOString(),
      rounds:roundNum+1,
      playerCount:pc,
      names:names,
      winner:bestIdx,
      results:ev,
      event:"jackpot",
      jackpotPool:newPool,
      jackpotWin:jackpotWinInfo
    });

    setPhase("result");
    var hasContribs=Object.keys(jpContribs).length>0;
    if(jackpotWinInfo){
      // === JACKPOT WIN ===
      // Sequence: gross payouts shown → (1s) coins fly off + countdown → coins land on winner → JACKPOT
      if(hasContribs){
        setJackpotContrib({contribs:jpContribs,target:bestJp,total:poolAdd,gross:grossDeltas,net:deltas});
        setTimeout(function(){setJackpotContrib(null);},2900);
      }
      var winDelay=hasContribs?2700:300; // wait for gross display + coins to land
      setJackpotDrain(currentPool); // banner shows full pool, then drains
      setTimeout(function(){
        setJackpotWin(jackpotWinInfo);
        if(soundOn){SFX.win();setTimeout(launchConfetti,100);setTimeout(launchConfetti,500);setTimeout(launchConfetti,900);}
        var drainFrom=currentPool;
        var drainStart=600;
        var drainDur=1400;
        var drainSteps=Math.min(40,Math.max(12,drainFrom));
        var drainStepMs=Math.floor(drainDur/drainSteps);
        for(var ds=1;ds<=drainSteps;ds++){
          (function(step){
            setTimeout(function(){
              var v=Math.round(drainFrom*(1-step/drainSteps));
              setJackpotDrain(v<=0?0:v);
              if(soundOn&&step%3===0)SFX.buttonClick();
            },drainStart+step*drainStepMs);
          })(ds);
        }
        setTimeout(function(){setJackpotWin(null);setJackpotDrain(null);},4500);
      },winDelay);
    }else{
      if(soundOn){SFX.win();setTimeout(launchConfetti,100);}
      // === Pool ACCUMULATION (no JP win this round) ===
      if(poolAdd>0){
        var fromPool=jackpotPool; // before this round's add
        var toPool=newPool;       // after add
        // 1) Contributions fly from each payer to the pool banner (after 1s gross display)
        if(hasContribs){
          setJackpotContrib({contribs:jpContribs,target:"pool",total:poolAdd,gross:grossDeltas,net:deltas});
          setTimeout(function(){setJackpotContrib(null);},2900);
        }
        // Freeze the banner display at the PRE-round value during the gross-display
        // window. jackpotPool is already newPool (set at L3910 for save integrity),
        // so without this the banner would jump to the post-accumulation value the
        // instant cards flip. pending:true keeps the resting look (no glow/bounce)
        // while display:fromPool overrides the (already-updated) jackpotPool.
        setJackpotAddAnim({add:poolAdd,from:fromPool,to:toPool,display:fromPool,pending:true});
        // 2) Banner pulses and counts up after coins arrive
        setTimeout(function(){
          setJackpotAddAnim(function(prev){return prev?Object.assign({},prev,{pending:false,display:fromPool}):{add:poolAdd,from:fromPool,to:toPool,display:fromPool,pending:false};});
          if(soundOn)SFX.alertCow();
          var cuSteps=Math.min(30,Math.max(8,poolAdd));
          var cuDur=1000;
          var cuStepMs=Math.floor(cuDur/cuSteps);
          for(var cs=1;cs<=cuSteps;cs++){
            (function(step){
              setTimeout(function(){
                var v=Math.round(fromPool+(toPool-fromPool)*(step/cuSteps));
                setJackpotAddAnim(function(prev){return prev?Object.assign({},prev,{display:v}):prev;});
                if(soundOn&&step%3===0)SFX.buttonClick();
              },step*cuStepMs);
            })(cs);
          }
          setTimeout(function(){setJackpotAddAnim(null);},2200);
        },2500); // wait for gross display + coins to arrive
      }
    }
  }

  // Apply the roulette delta to all hands and update results
  function applyRouletteToHands(delta){
    setRouletteApplied(true);
    if(soundOn)SFX.alertCow();
    
    // === Phase 1: Set results immediately (so cards reflect final ranks behind the scenes) ===
    // But the displayed "label" comes from rouletteAnimRanks during the count-up.
    var evFinal=hands.map(function(h){return applyRouletteToEv(evaluateHand(h), delta);});
    setResults(evFinal);
    
    // === Phase 2: Count-up animation (2.5s total, all players sync) ===
    // For each player with bullRank in 1-10, animate from original to final rank.
    // Players with bullRank 0 or >=14 don't animate (unaffected by roulette).
    var originalEvs=hands.map(function(h){return evaluateHand(h);});
    var animatablePIs=[];
    for(var ai=0;ai<originalEvs.length;ai++){
      var origBR=originalEvs[ai].bullRank;
      if(origBR>=1&&origBR<=10&&delta!==0)animatablePIs.push(ai);
    }
    
    var animDurationMs=1500;
    var totalSteps=Math.abs(delta);
    
    if(animatablePIs.length===0||totalSteps===0){
      // No animation needed (delta=0 or no affected players) — skip directly to results
      setTimeout(function(){finalizeRouletteRound(delta,evFinal);},500);
      return;
    }
    
    // Initialize anim ranks at original values
    var initialAnim={};
    for(var ipi=0;ipi<originalEvs.length;ipi++){
      initialAnim[ipi]=originalEvs[ipi].bullRank;
    }
    setRouletteAnimRanks(initialAnim);
    
    // Each step advances all animatable players by 1 step (towards their target rank)
    // Direction: delta>0 → +1 per step, delta<0 → -1 per step (with modulo wrap)
    var stepDir=delta>0?1:-1;
    var stepInterval=Math.floor(animDurationMs/totalSteps);
    var currentStep=0;
    
    function advanceOneStep(){
      currentStep++;
      setRouletteAnimRanks(function(prev){
        var next=Object.assign({},prev);
        animatablePIs.forEach(function(pi){
          var cur=next[pi];
          // Move 1 step in stepDir, with 1-10 wrap
          var raw=cur-1+stepDir; // map 1-10 to 0-9
          var modded=((raw%10)+10)%10;
          next[pi]=modded+1;
        });
        return next;
      });
      if(soundOn)SFX.buttonClick(); // tick sound per step
      if(currentStep<totalSteps){
        setTimeout(advanceOneStep,stepInterval);
      }else{
        // Final step done. Trigger flash effect and finalize after a beat.
        setRouletteAnimFlash(true);
        if(soundOn)SFX.bullFound(); // confirmation sound
        setTimeout(function(){
          setRouletteAnimFlash(false);
          finalizeRouletteRound(delta,evFinal);
        },600);
      }
    }
    setTimeout(advanceOneStep,stepInterval);
  }

  // Finalize the round after roulette animation completes
  function finalizeRouletteRound(delta,evFinal){
    var ev=evFinal;
    var winnerForHistory=null;
    if(appMode==="flip"){
      var bb=-1,bh=-1,bi=0;
      ev.forEach(function(x,i){if(x.bullRank>bb||(x.bullRank===bb&&x.highCard>bh)){bb=x.bullRank;bh=x.highCard;bi=i;}});
      setScores(function(p){var n=Object.assign({},p);n[bi]=(n[bi]||0)+1;return n;});
      setWinner(bi);
      winnerForHistory=bi;
    }else{
      var dealerEv=ev[dealer];
      var deltas={};for(var ii=0;ii<pc;ii++)deltas[ii]=0;
      for(var ci2=0;ci2<pc;ci2++){
        if(ci2===dealer)continue;
        var childEv=ev[ci2];
        var dealerWins=dealerEv.bullRank>childEv.bullRank||(dealerEv.bullRank===childEv.bullRank&&dealerEv.highCard>childEv.highCard);
        var bet=bets[ci2]||1;
        var mult;
        if(betRule==="offset"){mult=calcMultiplierOffset(dealerEv.bullValue,childEv.bullValue);}
        else{mult=dealerWins?calcMultiplierNoOffset(dealerEv.bullValue):calcMultiplierNoOffset(childEv.bullValue);}
        var amount=Math.round(bet*mult);
        if(dealerWins){deltas[dealer]+=amount;deltas[ci2]-=amount;}
        else{deltas[dealer]-=amount;deltas[ci2]+=amount;}
      }
      setRoundDeltas(deltas);
      setChips(function(prev){var n=Object.assign({},prev);for(var k in deltas)n[k]=(n[k]||0)+deltas[k];return n;});
      var bestDelta=-Infinity,bestIdx=0;
      for(var k2 in deltas){if(deltas[k2]>bestDelta){bestDelta=deltas[k2];bestIdx=parseInt(k2);}}
      setWinner(bestIdx);
      winnerForHistory=bestIdx;
      setHistory(function(prev){return prev.concat([{round:roundNum+1,dealer:dealer,results:ev,deltas:deltas,bets:Object.assign({},bets),names:names.slice(),event:"roulette",rouletteDelta:delta}]);});
    }
    pushHistory("niuniu_history_event",{
      date:new Date().toISOString(),
      rounds:roundNum+1,
      playerCount:pc,
      names:names,
      winner:winnerForHistory,
      results:ev,
      event:"roulette",
      rouletteDelta:delta
    });
    setPhase("result");
    if(soundOn){SFX.win();setTimeout(launchConfetti,100);}
    // Clear anim state so result screen uses results normally
    setRouletteAnimRanks(null);
  }

  function openAllForEvent(){
    if(appMode!=="event")return;
    if(soundOn)SFX.deal();
    setRevealedCards(function(prev){
      var ns2=prev.map(function(s){return new Set(s);});
      for(var pi=0;pi<pc;pi++){
        ns2[pi].add(0);ns2[pi].add(1);ns2[pi].add(2);ns2[pi].add(3);ns2[pi].add(4);
      }
      var currentEvent=getCurrentEvent();
      // Transition to the event's specific phase (currently only hurricane uses this)
      setTimeout(function(){
        if(currentEvent==="hurricane"&&hurricaneTurn===null&&Object.keys(hurricaneDiscards).length===0){
          var firstChooser=(dealer+1)%pc;
          setHurricaneTurn(firstChooser);
          setPhase("hurricane");
          if(soundOn)SFX.deal();
        }
      },500);
      return ns2;
    });
  }

  function openThree(pi){
    if(soundOn)SFX.deal();
    var alert=alerts[pi];
    // Check if alert would be suppressed (niuniu impossible with 3 cards revealed)
    var willSuppress=false;
    if(alert&&(alert.type==="red"||alert.type==="glitch")&&hands[pi]){
      var first3=[hands[pi][0],hands[pi][1],hands[pi][2]];
      if(!canStillBeNiuNiu(first3))willSuppress=true;
    }
    if(alert&&alert.timing==="three"&&soundOn&&!willSuppress){setTimeout(function(){playAlertSFX(alert.type);},400);}
    setRevealedCards(function(prev){
      var ns2=prev.map(function(s){return new Set(s);});
      ns2[pi].add(0);ns2[pi].add(1);ns2[pi].add(2);
      var c=hands[pi];
      if(c){var sum=rankPoints(c[0].rank)+rankPoints(c[1].rank)+rankPoints(c[2].rank);
        if(sum%10===0&&soundOn&&!(alert&&alert.timing==="three"&&!willSuppress))setTimeout(function(){SFX.bullFound();},300);}
      return ns2;
    });
  }

  function revealCard(pi,ci){
    setRevealedCards(function(prev){
      var ns2=prev.map(function(s){return new Set(s);});
      ns2[pi].add(ci);
      var alert=alerts[pi];
      // Undei mode: dynamic whiteblack decision at 4-card squeeze (v1.4.11)
      if(ns2[pi].size===4&&gameMode==="undei"&&!alert){
        var undeiResult=computeUndeiWhiteblackAt4(pi,ns2[pi]);
        if(undeiResult){
          // Inject the dynamically-computed alert and trigger SFX
          setAlerts(function(prevA){
            var na={};for(var k in prevA)na[k]=prevA[k];
            na[pi]=undeiResult;
            return na;
          });
          alert=undeiResult; // also reflect locally for downstream sfx
          if(soundOn)setTimeout(function(){playAlertSFX(undeiResult.type);},200);
        }
      }
      // Check suppression for 4-card alert
      var willSuppress4=false;
      if(ns2[pi].size===4&&alert&&(alert.type==="red"||alert.type==="glitch")&&hands[pi]){
        var revealed4=[];
        ns2[pi].forEach(function(idx){revealed4.push(hands[pi][idx]);});
        if(!canStillBeNiuNiu(revealed4))willSuppress4=true;
      }
      if(ns2[pi].size===4&&alert&&alert.timing==="four"&&alert.type!=="whiteblack"&&soundOn&&!willSuppress4){setTimeout(function(){playAlertSFX(alert.type);},200);}
      if(ns2[pi].size===5&&soundOn){var ev2=evaluateHand(hands[pi]);setTimeout(function(){if(ev2.hasBull)SFX.bullFound();else SFX.noBull();},200);}
      if(ns2[pi].size===4&&soundOn&&!(alert&&alert.timing==="four"&&!willSuppress4)){
        var c=hands[pi],vi=Array.from(ns2[pi]);
        for(var a=0;a<vi.length;a++)for(var b=a+1;b<vi.length;b++)for(var d=b+1;d<vi.length;d++){
          if((rankPoints(c[vi[a]].rank)+rankPoints(c[vi[b]].rank)+rankPoints(c[vi[d]].rank))%10===0){setTimeout(function(){SFX.bullFound();},200);a=b=d=99;}
        }
      }
      if(ns2.every(function(s){return s.size===5;})){
        setTimeout(function(){
          // EVENT MODE: Hurricane — if event mode and hurricane not yet processed, enter hurricane phase
          if(appMode==="event"&&getCurrentEvent()==="hurricane"&&hurricaneTurn===null&&Object.keys(hurricaneDiscards).length===0){
            // Start hurricane: first chooser is the player left of the dealer
            var firstChooser=(dealer+1)%pc;
            setHurricaneTurn(firstChooser);
            setPhase("hurricane");
            if(soundOn)SFX.deal();
            return; // skip result calculation
          }
          // EVENT MODE: Roulette — if event mode and roulette not yet rolled, enter roulette phase
          if(appMode==="event"&&getCurrentEvent()==="roulette"&&rouletteDelta===null){
            // Skip check: if no player has bullRank 1-10, roulette has no effect → skip entirely
            var anyPlayerInScope=false;
            var origScope={};
            for(var rspi=0;rspi<hands.length;rspi++){
              if(!hands[rspi])continue;
              var evScope=evaluateHand(hands[rspi]);
              origScope[rspi]=evScope.bullRank;
              if(evScope.bullRank>=1&&evScope.bullRank<=10)anyPlayerInScope=true;
            }
            if(anyPlayerInScope){
              // 通常通り: ルーレットフェーズへ遷移
              setRouletteOriginalRanks(origScope);
              setPhase("roulette");
              return; // skip result calculation
            }
            // 全員対象外 → ルーレットフェーズをスキップして通常 result 計算へフォールスルー
            // (下記の通常 evaluateHand 経路がそのまま動く)
          }
          // EVENT MODE: Jackpot — no special phase, compute payouts with JP rules directly
          if(appMode==="event"&&getCurrentEvent()==="jackpot"){
            finalizeJackpotRound();
            return; // skip the generic result calculation below
          }
          if(appMode==="event"&&getCurrentEvent()==="tulip"){
            finalizeTulipRound();
            return; // Tulip: compute payouts + play flip reveal
          }
          var ev=hands.map(function(h){return evaluateHand(h);});
          setResults(ev);

          if(appMode==="flip"){
            // Flip mode: simple winner
            var bb=-1,bh=-1,bi=0;
            ev.forEach(function(x,i){if(x.bullRank>bb||(x.bullRank===bb&&x.highCard>bh)){bb=x.bullRank;bh=x.highCard;bi=i;}});
            setScores(function(p){var n=Object.assign({},p);n[bi]=(n[bi]||0)+1;return n;});
            setWinner(bi);
          }else{
            // Battle mode: calculate chips
            var dealerEv=ev[dealer];
            var deltas={};for(var ii=0;ii<pc;ii++)deltas[ii]=0;
            for(var ci2=0;ci2<pc;ci2++){
              if(ci2===dealer)continue;
              var childEv=ev[ci2];
              var dealerWins=dealerEv.bullRank>childEv.bullRank||(dealerEv.bullRank===childEv.bullRank&&dealerEv.highCard>childEv.highCard);
              var bet=bets[ci2]||1;
              var mult;
              if(betRule==="offset"){mult=calcMultiplierOffset(dealerEv.bullValue,childEv.bullValue);}
              else{mult=dealerWins?calcMultiplierNoOffset(dealerEv.bullValue):calcMultiplierNoOffset(childEv.bullValue);}
              var amount=Math.round(bet*mult);
              if(dealerWins){deltas[dealer]+=amount;deltas[ci2]-=amount;}
              else{deltas[dealer]-=amount;deltas[ci2]+=amount;}
            }
            setRoundDeltas(deltas);
            setChips(function(prev){var n=Object.assign({},prev);for(var k in deltas)n[k]=(n[k]||0)+deltas[k];return n;});
            // Find biggest winner for crown
            var bestDelta=-Infinity,bestIdx=0;
            for(var k2 in deltas){if(deltas[k2]>bestDelta){bestDelta=deltas[k2];bestIdx=parseInt(k2);}}
            setWinner(bestIdx);
            // Save history (include event marker when in roulette event mode)
            var histEntry={round:roundNum+1,dealer:dealer,results:ev,deltas:deltas,bets:Object.assign({},bets),names:names.slice()};
            if(appMode==="event"&&getCurrentEvent()==="roulette"){histEntry.event="roulette";histEntry.rouletteDelta=0;histEntry.rouletteSkipped=true;}
            setHistory(function(prev){return prev.concat([histEntry]);});
          }
          setPhase("result");
          if(soundOn){SFX.win();setTimeout(launchConfetti,100);}
        },400);
      }
      return ns2;
    });
  }

  // ─── SECRET MENU ACTIONS ─────────────────────────────────────
  function doPeek(){
    if(!hands||hands.length===0)return;
    if(peekActive)return; // prevent overlapping peeks
    if(soundOn)SFX.deal();
    var dir=Math.random()<0.5?"h":"v";
    setPeekActive({dir:dir,phase:"open"});
    // open(0.5s) -> hold(2s) -> close(0.5s) -> done
    setTimeout(function(){setPeekActive({dir:dir,phase:"hold"});},500);
    setTimeout(function(){setPeekActive({dir:dir,phase:"close"});},2500);
    setTimeout(function(){setPeekActive(null);},3000);
  }

  // ─── BATTLE CONFIG ACTIONS ────────────────────────────────────
  // Random seat: shuffle (name, chips) pairs across active seats
  function doRandomSeat(targetPc){
    var n=targetPc||pc;
    // Build current pairs for active seats
    var pairs=[];
    for(var i=0;i<n;i++){
      pairs.push({name:(names[i]||""),chips:(chips[i]||0)});
    }
    // Fisher-Yates shuffle
    for(var i2=pairs.length-1;i2>0;i2--){
      var j=Math.floor(Math.random()*(i2+1));
      var tmp=pairs[i2];pairs[i2]=pairs[j];pairs[j]=tmp;
    }
    // Apply to names and chips
    var newNames=names.slice();
    var newChips={};
    for(var k=0;k<n;k++){
      newNames[k]=pairs[k].name;
      newChips[k]=pairs[k].chips;
    }
    setNames(newNames);
    setChips(newChips);
    if(soundOn)SFX.buttonClick();
  }

  // Remove a player at given seat, archive to inactivePlayers, re-pack remaining seats
  function doRemovePlayer(seatIdx){
    // Save the leaving player's info
    var leavingName=names[seatIdx]||("プレイヤー"+(seatIdx+1));
    var leavingChips=chips[seatIdx]||0;
    var entry={name:leavingName,chips:leavingChips,leftAtRound:roundNum,emojiIdx:seatIdx};
    setInactivePlayers(function(prev){return prev.concat([entry]);});
    // Re-pack remaining seats: remove seatIdx, shift others down
    var newNames=[];
    var newChips={};
    var newBets={};
    var newSeat=0;
    for(var i=0;i<pc;i++){
      if(i===seatIdx)continue;
      newNames[newSeat]=names[i]||"";
      newChips[newSeat]=chips[i]||0;
      newBets[newSeat]=bets[i]||1;
      newSeat++;
    }
    // Pad names to length 6 for safety
    while(newNames.length<6)newNames.push("");
    setNames(newNames);
    setChips(newChips);
    setBets(newBets);
    setPc(pc-1);
    if(soundOn)SFX.buttonClick();
  }

  // Add a new player slot (chip 0, default name)
  function doAddPlayer(targetPc){
    var newPc=targetPc;
    var newChips=Object.assign({},chips);
    for(var i=pc;i<newPc;i++){
      newChips[i]=0;
    }
    setChips(newChips);
    setPc(newPc);
    if(soundOn)SFX.buttonClick();
  }

  // ─── SPLASH Screen ──────────────────────────────────────────
  if(appMode==="splash"){
